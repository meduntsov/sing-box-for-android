name: Build BelkaVPN

on:
  workflow_dispatch:
  push:
    branches:
      - alice-health

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patched SFA
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Setup Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Clone sing-box
        run: |
          git clone --depth 1 \
            --branch testing \
            https://github.com/SagerNet/sing-box.git \
            "$RUNNER_TEMP/sing-box"

      - name: Build arm64 libbox
        working-directory: ${{ runner.temp }}/sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"

      - name: Restore and pin signing key
        shell: bash
        env:
          ALICE_DEBUG_KEYSTORE: ${{ secrets.ALICE_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail

          if [ -z "${ALICE_DEBUG_KEYSTORE:-}" ]; then
            echo "::error::GitHub Secret ALICE_DEBUG_KEYSTORE is missing or empty"
            exit 1
          fi

          printf '%s' "$ALICE_DEBUG_KEYSTORE" | base64 --decode > app/release.keystore
          chmod 600 app/release.keystore

          mkdir -p "$HOME/.android"
          cp app/release.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          cat > local.properties <<'EOF'
          KEYSTORE_PASS=android
          ALIAS_NAME=androiddebugkey
          ALIAS_PASS=android
          EOF

          KEYSTORE_CERT_SHA256="$(keytool -list -v \
            -keystore app/release.keystore \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Unable to read signing certificate SHA-256"
            exit 1
          fi

          echo "KEYSTORE_CERT_SHA256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_ENV"
          echo "Pinned signing certificate SHA-256: $KEYSTORE_CERT_SHA256"

      - name: Apply BelkaVPN health policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_belka_health_policy.py

      - name: Apply BelkaVPN fast gate v2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_belka_fast_gate_v2.py

      - name: Apply BelkaVPN HTTP probe v3
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_belka_http_probe_v3.py

      - name: Apply BelkaVPN network guard v4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_belka_network_guard_v4.py

      - name: Apply BelkaVPN resilience v5
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_belka_resilience_v5.py

      - name: Set BelkaVPN version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("version.properties")
          text = path.read_text(encoding="utf-8")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run_number
          version_name = f"2.7.{run_number}"

          text, count_code = re.subn(
              r"(?m)^VERSION_CODE\s*=\s*\d+\s*$",
              f"VERSION_CODE={version_code}",
              text,
              count=1,
          )
          text, count_name = re.subn(
              r"(?m)^VERSION_NAME\s*=\s*.*$",
              f"VERSION_NAME={version_name}",
              text,
              count=1,
          )

          if count_code != 1 or count_name != 1:
            raise SystemExit(
              f"version.properties patch failed: code={count_code} name={count_name}"
            )

          path.write_text(text, encoding="utf-8")
          print(f"BelkaVPN VERSION_CODE={version_code}")
          print(f"BelkaVPN VERSION_NAME={version_name}")
          PY

      - name: Build BelkaVPN
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare and verify release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*arm64-v8a-debug.apk' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::arm64-v8a APK not found"
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          echo "Keystore cert: $KEYSTORE_CERT_SHA256"
          echo "APK cert:      $APK_CERT_SHA256"

          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match pinned keystore"
            exit 1
          fi

          RELEASE_APK="$RUNNER_TEMP/BelkaVPN-arm64-v8a.apk"
          RELEASE_SHA="$RUNNER_TEMP/BelkaVPN-arm64-v8a.apk.sha256"
          RELEASE_META="$RUNNER_TEMP/SFA-version-metadata.json"

          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | awk '{print $1}' > "$RELEASE_SHA"

          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"

          cat > "$RELEASE_META" <<EOF
          {
            "version_code": $VERSION_CODE,
            "version_name": "$VERSION_NAME",
            "signing_cert_sha256": "$APK_CERT_SHA256"
          }
          EOF

          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_META=$RELEASE_META" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "APK: $RELEASE_APK"
          echo "SHA256: $(cat "$RELEASE_SHA")"
          cat "$RELEASE_META"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="belkavpn-$VERSION_CODE"
          TITLE="BelkaVPN $VERSION_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RELEASE_APK" \
              "$RELEASE_SHA" \
              "$RELEASE_META" \
              --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_APK" \
              "$RELEASE_SHA" \
              "$RELEASE_META" \
              --title "$TITLE" \
              --notes "BelkaVPN $VERSION_NAME — pinned signing key with APK certificate verification, TLS SNI AI routing to DE, resilient health selection."
          fi

      - name: Show APKs
        if: always()
        run: |
          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BelkaVPN-SFA
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build BelkaVPN

on:
  workflow_dispatch:
  push:
    branches:
      - alice-health

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patched SFA
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Setup Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Clone sing-box
        run: |
          git clone --depth 1 \
            --branch testing \
            https://github.com/SagerNet/sing-box.git \
            "$RUNNER_TEMP/sing-box"

      - name: Build arm64 libbox
        working-directory: ${{ runner.temp }}/sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/arm64

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"

      - name: Restore persistent debug signing key
        shell: bash
        env:
          ALICE_DEBUG_KEYSTORE: ${{ secrets.ALICE_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail

          if [ -z "${ALICE_DEBUG_KEYSTORE:-}" ]; then
            echo "::error::GitHub Secret ALICE_DEBUG_KEYSTORE is missing or empty"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$ALICE_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Alias name:|SHA256:' || true

      - name: Set BelkaVPN version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("version.properties")
          text = path.read_text(encoding="utf-8")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = 100000 + run_number
          version_name = f"2.2.1.{run_number}"

          text, count_code = re.subn(
              r"(?m)^VERSION_CODE\s*=\s*\d+\s*$",
              f"VERSION_CODE={version_code}",
              text,
              count=1,
          )
          text, count_name = re.subn(
              r"(?m)^VERSION_NAME\s*=\s*.*$",
              f"VERSION_NAME={version_name}",
              text,
              count=1,
          )

          if count_code != 1 or count_name != 1:
              raise SystemExit(
                  f"version.properties patch failed: code={count_code} name={count_name}"
              )

          path.write_text(text, encoding="utf-8")
          print(f"BelkaVPN VERSION_CODE={version_code}")
          print(f"BelkaVPN VERSION_NAME={version_name}")
          PY

      - name: Build BelkaVPN
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare release APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*arm64-v8a-debug.apk' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::arm64-v8a APK not found"
            exit 1
          fi

          RELEASE_APK="$RUNNER_TEMP/BelkaVPN-arm64-v8a.apk"
          RELEASE_SHA="$RUNNER_TEMP/BelkaVPN-arm64-v8a.apk.sha256"

          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | awk '{print $1}' > "$RELEASE_SHA"

          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"

          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "APK: $RELEASE_APK"
          echo "SHA256: $(cat "$RELEASE_SHA")"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="belkavpn-$VERSION_CODE"
          TITLE="BelkaVPN $VERSION_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RELEASE_APK" \
              "$RELEASE_SHA" \
              --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_APK" \
              "$RELEASE_SHA" \
              --title "$TITLE" \
              --notes "BelkaVPN $VERSION_NAME — automated signed arm64 build."
          fi

      - name: Show APKs
        if: always()
        run: |
          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BelkaVPN-SFA
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
